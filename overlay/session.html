<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>YeahMel Session Stats</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Suggested OBS size: 520 x 300 */
  body { width: 520px; height: 300px; padding: 10px; }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px; padding: 18px 22px;
    height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  header h2 { font-family: var(--display); font-size: 26px; letter-spacing: .25em; color: var(--gold); }
  header span { color: var(--muted); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .big .n { font-family: var(--display); font-size: 54px; font-weight: 700; line-height: 1; }
  .big .l { font-size: 11px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .w { color: #3ddc84; } .l-c { color: #ff5470; }
  .small { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; border-top: 1px solid var(--panel-edge); padding-top: 10px; }
  .small .n { font-weight: 800; font-size: 22px; }
  .small .l { font-size: 10px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
  .form { display: flex; gap: 5px; justify-content: center; align-self: end; }
  .form i { width: 22px; height: 6px; border-radius: 3px; background: #3ddc84; }
  .form i.loss { background: #ff5470; } .form i.nc { background: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <header><h2 id="brand">YEAHMEL</h2><span>Session</span></header>
    <div class="big">
      <div><div class="n w tabular" id="wins">0</div><div class="l">Wins</div></div>
      <div><div class="n l-c tabular" id="losses">0</div><div class="l">Losses</div></div>
      <div><div class="n tabular" id="streak">0</div><div class="l">Streak</div></div>
    </div>
    <div>
      <div class="small">
        <div><div class="n tabular" id="goals">0</div><div class="l">Goals</div></div>
        <div><div class="n tabular" id="assists">0</div><div class="l">Assists</div></div>
        <div><div class="n tabular" id="saves">0</div><div class="l">Saves</div></div>
        <div><div class="n tabular" id="demos">0</div><div class="l">Demos</div></div>
        <div><div class="n tabular" id="fastest">0</div><div class="l">Top km/h</div></div>
      </div>
      <div class="form" id="form" style="margin-top:12px"></div>
    </div>
  </div>
<script src="overlay.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  if (location.search.includes('preview')) document.body.classList.add('preview');
  $('brand').textContent = RL.param('brand', 'YEAHMEL').toUpperCase();
  let last = '';
  RL.connect(({ session: s }) => {
    const key = JSON.stringify(s);
    if (key === last) return; // only redraw when something changed
    last = key;
    $('wins').textContent = s.wins;
    $('losses').textContent = s.losses;
    $('streak').textContent = s.streak > 0 ? `W${s.streak}` : s.streak < 0 ? `L${-s.streak}` : '–';
    $('streak').className = 'n tabular ' + (s.streak > 0 ? 'w' : s.streak < 0 ? 'l-c' : '');
    for (const k of ['goals', 'assists', 'saves', 'demos']) $(k).textContent = s[k];
    $('fastest').textContent = s.fastestGoalKph || 0;
    $('form').innerHTML = s.matches.slice(0, 10).reverse().map((m) => `<i class="${m.result}" title="${m.score}"></i>`).join('');
  });
</script>
</body>
</html>
